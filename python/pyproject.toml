# Not a package: the environment for the tests. Each script lists its own dependencies in its header.
[project]
name = "eelsdb-tools"
version = "0"
requires-python = ">=3.12"
dependencies = [
    "h5py>=3.16.0",
    "numpy>=2.5.4",
    "rosettasciio>=0.15.0",
]

[dependency-groups]
dev = [
    "exspy>=0.3.2",
    "hyperspy>=2.5.0",
    "lxml>=6.1.3",
    "pyshacl>=0.40.1",
    "pytest>=9.1.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
